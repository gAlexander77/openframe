# The gates from CLAUDE.md: type check and unit tests for the editor, fmt,
# clippy and tests for the desktop shell. Windows for Rust: the desktop
# target, and it needs no extra system libraries for Tauri. The app lives in
# openframe-application/.
#
# Manual only (ADR-082): runners cost the owner money, so this runs only
# when the owner starts it (Actions > CI > Run workflow). Agents never start
# it and never add push or pull_request triggers back; they run the same
# gates locally. The website's deploy (pages.yml) is the one automatic
# workflow.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openframe-application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openframe-application/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    name: Desktop shell (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openframe-application/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openframe-application/src-tauri
      # Tauri's build script wants the web build's folder to exist; the
      # checks need only the Rust.
      - run: New-Item -ItemType Directory -Force ../dist | Out-Null
        shell: pwsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
