[package]
name = "video-editor"
version = "0.1.0"
description = "Video Editor"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# Cargo needs on Windows (rust-lang/cargo#8519).
name = "video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
