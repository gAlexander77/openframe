[package]
name = "openframe"
version = "0.1.0"
license = "GPL-3.0-only"
description = "OpenFrame: a desktop-first video editor"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# Cargo needs on Windows (rust-lang/cargo#8519).
name = "openframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# Job Objects: a crashed app must not leave ffmpeg.exe running (ffmpeg.rs),
# and ShellExecute opens an agent CLI's install guide (agent_cli.rs).
# Already in the tree through tauri; this only turns on API modules.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
